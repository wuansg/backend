name: Deploy backend contracts
on:
  push:
    branches: ['**']
    paths:
      - 'libs/contract/package.json'
      - '.github/workflows/deploy-lib.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies and build
        working-directory: 'libs/contract'
        run: npm i && npm run prepublish

      - name: Pack contract
        id: contract
        working-directory: 'libs/contract'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_FILE=$(npm pack --pack-destination "$RUNNER_TEMP")
          RELEASE_TAG="backend-contract-v${PACKAGE_VERSION}"

          echo "file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
          echo "path=${RUNNER_TEMP}/${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish contract release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.contract.outputs.tag }}"
          RELEASE_TITLE="Backend contract ${{ steps.contract.outputs.version }}"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "Contract package for ${{ github.sha }}."
          fi

          gh release upload "$RELEASE_TAG" "${{ steps.contract.outputs.path }}" --clobber

      # - name: Install HashedSet dependencies and build
      #   working-directory: 'libs/hashed-set'
      #   run: npm i && npm run prepublish

      # - name: Publish HashedSet package on NPM
      #   working-directory: 'libs/hashed-set'
      #   run: npm publish --provenance --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  send-telegram-message:
    name: Send Telegram message
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@a91054d90d24a7063d89e6bb241c1d569943e47f # v3.0.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: success
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Deploy contract finished.'

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@a91054d90d24a7063d89e6bb241c1d569943e47f # v3.0.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: failure
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Deploy contract failed.'
