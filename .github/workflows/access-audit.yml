name: Node releases and selected-user audit regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/modules/access-audit/**'
      - 'src/modules/node-deployments/**'
      - 'src/modules/nodes/**'
      - 'src/modules/config-profiles/**'
      - 'src/queue/_nodes/**'
      - 'src/common/axios/**'
      - 'src/common/database/opaque-json-camel-case.plugin.ts'
      - 'src/common/guards/scopes/**'
      - 'libs/contract/commands/access-audit/**'
      - 'libs/contract/commands/node-deployments/**'
      - 'libs/contract/commands/nodes/**'
      - 'libs/contract/commands/config-profiles/**'
      - 'libs/contract/api/controllers-info.ts'
      - 'prisma/**'
      - 'scripts/test-access-audit.ts'
      - 'scripts/test-node-deployments.ts'
      - 'scripts/test-forwarding-topology.ts'
      - 'libs/contract/api/controllers/nodes.ts'
      - 'libs/contract/api/routes.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/access-audit.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: audit_test
          POSTGRES_PASSWORD: isolated-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://audit_test:isolated-fixture-only@127.0.0.1:5432/audit_test
      AUDIT_TEST_DATABASE_URL: postgresql://audit_test:isolated-fixture-only@127.0.0.1:5432/audit_test
      NODE_DEPLOYMENTS_TEST_DATABASE_URL: postgresql://audit_test:isolated-fixture-only@127.0.0.1:5432/audit_test
      TOPOLOGY_TEST_DATABASE_URL: postgresql://audit_test:isolated-fixture-only@127.0.0.1:5432/audit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - run: npm run test:access-audit
      - run: npm run test:node-deployments
      - run: npm run test:forwarding-topology
      - run: npm run test:opaque-json && npm run test:api-scope-catalog
      - run: npm run build
