name: Directional usage regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/modules/*usage-history/**'
      - 'src/common/utils/*usage-range.util.ts'
      - 'src/common/utils/traffic-direction.util.ts'
      - 'libs/contract/commands/bandwidth-stats/**'
      - 'libs/contract/models/traffic-direction.schema.ts'
      - 'scripts/test-directional-usage.ts'
      - '.github/workflows/directional-usage.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: remnawave_usage_stats_test
          POSTGRES_USER: usage_stats_test
          POSTGRES_PASSWORD: isolated-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usage_stats_test -d remnawave_usage_stats_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      USAGE_STATS_TEST_DATABASE_URL: postgresql://usage_stats_test:isolated-fixture-only@127.0.0.1:5432/remnawave_usage_stats_test?connection_limit=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:directional-usage
      - run: npm run test:usage-snapshots && npm run test:forwarding-usage
