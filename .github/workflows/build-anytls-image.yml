name: Build AnyTLS Image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/anytls-singbox-mvp

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: meta
        run: |
          echo "version=$(jq -r .version package.json)-anytls" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$(curl -s https://api.github.com/repos/${{ github.repository_owner }}/frontend/commits/feature/anytls-singbox-mvp | jq -r '.sha')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=backend-anytls-arm64
          cache-to: type=gha,mode=max,scope=backend-anytls-arm64
          build-args: |
            FRONTEND_REPO=https://github.com/${{ github.repository_owner }}/frontend.git
            FRONTEND_REF=feature/anytls-singbox-mvp
            FRONTEND_CACHE_BUST=${{ steps.meta.outputs.frontend_commit }}
            __RW_METADATA_GIT_BRANCH=feature/anytls-singbox-mvp
            __RW_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:anytls-singbox-mvp
            ghcr.io/${{ github.repository_owner }}/backend:anytls-${{ github.sha }}
