name: Build AnyTLS Image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/anytls-singbox-mvp
      - upgrade/upstream-2.8.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: meta
        run: |
          echo "version=$(jq -r .version package.json)-anytls" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$(git ls-remote https://github.com/${{ github.repository_owner }}/frontend.git refs/heads/${{ github.ref_name }} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Reject an existing immutable version tag
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "Version tag ${{ steps.meta.outputs.version }} already exists; bump package.json before publishing."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend-anytls-amd64
          cache-to: type=gha,mode=max,scope=backend-anytls-amd64
          build-args: |
            FRONTEND_REPO=https://github.com/${{ github.repository_owner }}/frontend.git
            FRONTEND_REF=${{ github.ref_name }}
            FRONTEND_CACHE_BUST=${{ steps.meta.outputs.frontend_commit }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:anytls-singbox-mvp
            ghcr.io/${{ github.repository_owner }}/backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/backend:anytls-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            io.remnawave.frontend.revision=${{ steps.meta.outputs.frontend_commit }}
