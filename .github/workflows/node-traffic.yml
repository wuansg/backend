name: Node traffic quota regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/common/utils/node-traffic-period.util.ts'
      - 'src/queue/_nodes/usage-snapshot*.ts'
      - 'src/modules/nodes/nodes.service.ts'
      - 'src/modules/nodes/entities/nodes.entity.ts'
      - 'src/modules/nodes/nodes.converter.ts'
      - 'src/scheduler/tasks/reset-node-traffic/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/*node_forwarding_traffic_quota/**'
      - 'scripts/test-node-traffic.ts'
      - '.github/workflows/node-traffic.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: remnawave_node_traffic_test
          POSTGRES_USER: node_traffic_test
          POSTGRES_PASSWORD: isolated-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U node_traffic_test -d remnawave_node_traffic_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_TRAFFIC_TEST_DATABASE_URL: postgresql://node_traffic_test:isolated-fixture-only@127.0.0.1:5432/remnawave_node_traffic_test?connection_limit=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit --incremental false
      - run: npm run test:node-traffic
      - run: npm run test:usage-snapshots && npm run test:forwarding-usage && npm run test:daily-traffic
